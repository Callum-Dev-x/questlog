<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>questlog</title>
<meta name="description" content="Offline-first habit, task and milestone tracker that turns your day into XP, levels and streaks. No account, no server.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0d13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6fb" media="(prefers-color-scheme: light)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="questlog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view-host"></main>
    <nav id="nav" class="tabbar" aria-label="Sections"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title" class="modal-title"></h2>
      <button class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="modal-body"></div>
  </dialog>

  <noscript>
    <p style="padding:24px;font:16px system-ui">questlog needs JavaScript — it runs entirely in your browser, with no server to fall back on.</p>
  </noscript>

  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
